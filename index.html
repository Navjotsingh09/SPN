<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sikh Professional Network — Coming Soon</title>
    <meta name="description" content="Sikh Professional Network — Connecting Sikh professionals worldwide. Website coming soon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background: #f8f8fa;
        }

        .bg-blur {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .bg-blur .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
        }
        .blob-1 {
            width: 900px; height: 900px;
            top: -20%; left: -10%;
            background: radial-gradient(circle, rgba(251, 207, 232, 0.5) 0%, transparent 70%);
        }
        .blob-2 {
            width: 800px; height: 800px;
            top: 10%; right: -15%;
            background: radial-gradient(circle, rgba(186, 230, 253, 0.5) 0%, transparent 70%);
        }
        .blob-3 {
            width: 700px; height: 700px;
            bottom: -10%; left: 30%;
            background: radial-gradient(circle, rgba(253, 220, 236, 0.35) 0%, transparent 70%);
        }
        .blob-4 {
            width: 600px; height: 600px;
            top: 40%; right: 10%;
            background: radial-gradient(circle, rgba(207, 250, 254, 0.3) 0%, transparent 70%);
        }

        .content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 3rem 4rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: auto;
        }
        .logo .khanda {
            font-size: 2rem;
            color: #0ea5e9;
            line-height: 1;
        }
        .logo .wordmark {
            font-size: 1.15rem;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: -0.01em;
        }

        .main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            max-width: 900px;
        }

        .label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #0ea5e9;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 900;
            color: #0f172a;
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
        }

        .subtitle {
            font-size: 1.15rem;
            color: #64748b;
            line-height: 1.6;
            max-width: 480px;
        }

        .subtitle a {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 500;
        }
        .subtitle a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .content {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blur">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div class="content">
        <div class="logo">
            <span class="khanda">☬</span>
            <span class="wordmark">SikhPN</span>
        </div>

        <div class="main">
            <p class="label">Coming Soon</p>
            <h1>Sikh<br>Professional<br>Network</h1>
            <p class="subtitle">Connecting Sikh professionals worldwide.<br>Get in touch — <a href="mailto:Admin@sikhpn.org">Admin@sikhpn.org</a></p>
        </div>
    </div>
</body>
</html>
