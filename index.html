<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sikh Professional Network — Coming Soon</title>
    <meta name="description" content="Sikh Professional Network — Connecting Sikh professionals worldwide. Website coming soon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background: #f8f8fa;
        }

        .bg-blur {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .bg-blur .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
        }
        .blob-1 {
            width: 900px; height: 900px;
            top: -20%; left: -10%;
            background: radial-gradient(circle, rgba(251, 207, 232, 0.5) 0%, transparent 70%);
        }
        .blob-2 {
            width: 800px; height: 800px;
            top: 10%; right: -15%;
            background: radial-gradient(circle, rgba(186, 230, 253, 0.5) 0%, transparent 70%);
        }
        .blob-3 {
            width: 700px; height: 700px;
            bottom: -10%; left: 30%;
            background: radial-gradient(circle, rgba(253, 220, 236, 0.35) 0%, transparent 70%);
        }
        .blob-4 {
            width: 600px; height: 600px;
            top: 40%; right: 10%;
            background: radial-gradient(circle, rgba(207, 250, 254, 0.3) 0%, transparent 70%);
        }

        .content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 3rem 4rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: auto;
        }
        .logo img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
        }
        .logo .wordmark {
            font-size: 1.15rem;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: -0.01em;
        }

        .main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            max-width: 900px;
        }

        .label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #0ea5e9;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 900;
            color: #0f172a;
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
        }

        .subtitle {
            font-size: 1.15rem;
            color: #64748b;
            line-height: 1.6;
            max-width: 480px;
            margin-bottom: 2rem;
        }

        .subtitle a {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 500;
        }
        .subtitle a:hover {
            text-decoration: underline;
        }

        .linkedin-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #0a66c2;
            color: #fff;
            font-size: 0.925rem;
            font-weight: 600;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.2s;
            width: fit-content;
        }
        .linkedin-btn:hover {
            background: #004182;
        }
        .linkedin-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        @media (max-width: 768px) {
            .content {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blur">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div class="content">
        <div class="logo">
            <img src="sikhprofessionalsnetwork_logo.jpeg" alt="SPN Logo">
            <span class="wordmark">SikhPN</span>
        </div>

        <div class="main">
            <p class="label">Coming Soon</p>
            <h1>Sikh<br>Professional<br>Network</h1>
            <p class="subtitle">Connecting Sikh professionals worldwide.<br>Get in touch &mdash; <a href="mailto:Admin@sikhpn.org">Admin@sikhpn.org</a></p>
            <a href="https://www.linkedin.com/company/sikhprofessionalsnetwork/about/" target="_blank" rel="noopener noreferrer" class="linkedin-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                Follow us on LinkedIn
            </a>
        </div>
    </div>
</body>
</html>
