<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sikh Professionals Network — Coming Soon</title>
  <meta name="description" content="The Sikh Professionals Network is coming soon. Connect, Empower, Succeed.">
  <link rel="icon" href="sikhprofessionalsnetwork_logo.jpeg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..125,100..700;1,75..125,100..700&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --dark:#132030;
      --dark2:#172e49;
      --accent:#b86c40;
      --white:#ffffff;
      --off-white:#fbfbf9;
    }
    html,body{height:100%}
    body{
      font-family:'Instrument Sans',sans-serif;
      background:var(--dark);
      color:var(--white);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      position:relative;
    }

    /* subtle background texture */
    body::before{
      content:'';
      position:absolute;inset:0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(184,108,64,.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(23,46,73,.9) 0%, transparent 70%);
      pointer-events:none;
    }

    /* decorative top bar */
    .top-bar{
      position:absolute;top:0;left:0;right:0;
      height:4px;
      background:linear-gradient(90deg, var(--dark2) 0%, var(--accent) 50%, var(--dark2) 100%);
    }

    /* center card */
    .card{
      position:relative;z-index:1;
      display:flex;flex-direction:column;
      align-items:center;
      text-align:center;
      gap:0;
      padding:0 24px;
      max-width:720px;
      width:100%;
    }

    /* logo mark */
    .logo-mark{
      width:64px;height:74px;
      background:var(--accent);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
      margin-bottom:28px;
    }
    .logo-mark img{width:40px;height:40px;object-fit:contain}

    /* wordmark */
    .wordmark{
      font-family:'Lora',serif;
      font-size:18px;font-weight:400;
      color:rgba(255,255,255,.55);
      letter-spacing:4px;
      text-transform:uppercase;
      margin-bottom:56px;
    }

    /* divider */
    .divider{
      width:48px;height:2px;
      background:var(--accent);
      margin-bottom:48px;
    }

    /* heading */
    h1{
      font-family:'Lora',serif;
      font-size:clamp(48px, 8vw, 80px);
      font-weight:400;
      line-height:1;
      letter-spacing:-3px;
      color:var(--white);
      margin-bottom:28px;
    }
    h1 span{color:var(--accent)}

    /* sub */
    .sub{
      font-family:'Instrument Sans',sans-serif;
      font-size:18px;font-weight:400;
      color:rgba(255,255,255,.65);
      line-height:1.7;
      max-width:520px;
      margin-bottom:52px;
    }

    /* notify form */
    .notify-form{
      display:flex;gap:0;
      width:100%;max-width:460px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:4px;
      overflow:hidden;
      margin-bottom:64px;
    }
    .notify-form input{
      flex:1;
      background:rgba(255,255,255,.06);
      border:none;outline:none;
      padding:0 20px;
      font-family:'Inter',sans-serif;
      font-size:15px;
      color:var(--white);
      height:48px;
    }
    .notify-form input::placeholder{color:rgba(255,255,255,.38)}
    .notify-form button{
      background:var(--accent);
      border:none;
      padding:0 28px;
      height:48px;
      font-family:'Inter',sans-serif;
      font-size:15px;font-weight:600;
      color:#fff;
      cursor:pointer;
      white-space:nowrap;
      transition:background .2s;
      letter-spacing:.2px;
    }
    .notify-form button:hover{background:#a35b30}

    /* social row */
    .social-row{
      display:flex;gap:20px;align-items:center;
    }
    .social-link{
      width:40px;height:40px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:4px;
      display:flex;align-items:center;justify-content:center;
      color:rgba(255,255,255,.55);
      text-decoration:none;
      transition:border-color .2s, color .2s;
    }
    .social-link:hover{border-color:var(--accent);color:var(--accent)}
    .social-link svg{width:18px;height:18px;fill:currentColor}

    /* footer note */
    .foot{
      position:absolute;bottom:28px;left:0;right:0;
      text-align:center;
      font-family:'Inter',sans-serif;font-size:13px;
      color:rgba(255,255,255,.25);
      letter-spacing:.3px;
    }

    /* mobile */
    @media(max-width:480px){
      .notify-form{flex-direction:column;border:none;gap:12px;background:transparent}
      .notify-form input{
        border:1px solid rgba(255,255,255,.15);
        border-radius:4px;
        background:rgba(255,255,255,.06);
      }
      .notify-form button{border-radius:4px;width:100%}
    }
  </style>
</head>
<body>
  <div class="top-bar"></div>

  <div class="card">
    <!-- Logo -->
    <div class="logo-mark">
      <svg viewBox="0 0 400 400" width="44" height="44" xmlns="http://www.w3.org/2000/svg" aria-label="SPN">
        <circle cx="200" cy="200" r="200" fill="#0d1f4e"/>
        <rect x="88" y="108" width="224" height="184" rx="6" ry="6" fill="white"/>
        <text x="200" y="226" font-family="'Georgia','Times New Roman',serif" font-size="82" font-weight="700" fill="#0d1f4e" text-anchor="middle" letter-spacing="4">SPN</text>
        <text x="200" y="266" font-family="'Georgia','Times New Roman',serif" font-size="13.5" font-weight="400" fill="#0d1f4e" text-anchor="middle" letter-spacing="1.2">Sikh Professionals Network</text>
      </svg>
    </div>
    <p class="wordmark">Sikh Professionals Network</p>

    <div class="divider"></div>

    <h1>Coming <span>Soon</span></h1>
    <p class="sub">
      We are building something meaningful for the Sikh professional community.
      Connect, empower, and succeed&nbsp;&mdash; launching shortly.
    </p>

    <!-- Notify form -->
    <form class="notify-form" onsubmit="handleNotify(event)">
      <input type="email" placeholder="Enter your email address" required>
      <button type="submit">Notify Me</button>
    </form>

    <!-- Social -->
    <div class="social-row">
      <!-- LinkedIn -->
      <a href="#" class="social-link" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
      </a>
      <!-- Instagram -->
      <a href="#" class="social-link" aria-label="Instagram">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
        </svg>
      </a>
      <!-- X / Twitter -->
      <a href="#" class="social-link" aria-label="X">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.742l7.732-8.858L1.254 2.25H8.08l4.253 5.622 5.912-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </a>
    </div>
  </div>

  <p class="foot">&copy; 2026 Sikh Professionals Network. All rights reserved.</p>

  <script>
    function handleNotify(e) {
      e.preventDefault();
      var btn = e.target.querySelector('button');
      var input = e.target.querySelector('input');
      btn.textContent = 'Thank you';
      btn.style.background = '#2a6041';
      input.disabled = true;
      btn.disabled = true;
    }
  </script>
</body>
</html>
